<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Personal Médico - NovaSalud')}">
    <meta charset="UTF-8">
    <title>Médicos</title>
</head>
<body>

    <header th:replace="~{layout :: header}"></header>

    <div style="display: flex;">
        <aside th:replace="~{layout :: sidebar}"></aside>

        <main class="contenido" style="flex: 1; padding: 25px;">
            <h2 style="color: #2f7f7f; margin: 0 0 20px 0;">Personal Médico de la Clínica</h2>

            <table class="table-clinica" border="1" cellpadding="10" cellspacing="0" style="width: 100%; border-collapse: collapse; background: white; border: 1px solid #ddd;">
                <thead>
                    <tr>
                        <th style="width: 80px; text-align: left;">N°</th>
                        <th style="text-align: left;">Nombre del Profesional</th>
                        <th style="text-align: left;">Usuario de Acceso</th>
                        <th style="text-align: left;">Rol Asignado</th>
                        <th style="text-align: left;">Estado</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="m, stat : ${medicos}">
                        <td th:text="${stat.count}">1</td>
                        <td th:text="${m.nombreCompleto}">Dr. Carlos Mendoza</td>
                        <td th:text="${m.username}">dr_mendoza</td>
                        <td>Médico Especialista</td>
                        <td style="color: #2e7d32; font-weight: bold;">Activo</td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(medicos)}">
                        <td colspan="5" style="text-align: center; color: #777; padding: 20px;">
                            No hay médicos registrados actualmente en el sistema.
                        </td>
                    </tr>
                </tbody>
            </table>
        </main>
    </div>

    <script th:src="@{/js/app.js}"></script>
</body>
</html>
