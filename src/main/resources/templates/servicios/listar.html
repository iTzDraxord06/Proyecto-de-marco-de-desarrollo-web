<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout :: head('Servicios y Especialidades')}">
    <meta charset="UTF-8">
    <title>Servicios Médicos</title>
</head>
<body>

    <header th:replace="~{layout :: header}"></header>

    <div style="display: flex;">
        <aside th:replace="~{layout :: sidebar}"></aside>

        <main class="contenido" style="flex: 1;">
            <h2 style="color: #2f7f7f; margin-bottom: 20px;">Servicios y Especialidades Médicas</h2>

            <!-- Formulario de registro rápido para Admin/Recepción -->
            <div sec:authorize="hasAnyAuthority('ROLE_ADMIN', 'ROLE_RECEPCIONISTA')" style="background: white; padding: 15px; border: 1px solid #ddd; border-radius: 4px; margin-bottom: 25px; max-width: 500px;">
                <h4 style="margin-top: 0; color: #333;">Registrar Nueva Especialidad</h4>
                <form th:action="@{/servicios/guardar}" th:object="${nuevaEspecialidad}" method="post" style="display: flex; gap: 10px;">
                    <input type="text" th:field="*{nombre}" placeholder="Nombre de la especialidad..." required style="flex: 1; padding: 8px; border-radius: 4px; border: 1px solid #ccc;">
                    <button type="submit" class="btn-clinica" style="padding: 8px 15px; border: none; border-radius: 4px; cursor: pointer;">Agregar</button>
                </form>
            </div>

            <!-- Catálogo de especialidades -->
            <table class="table-clinica" border="1" cellpadding="10" cellspacing="0" style="width: 100%; border-collapse: collapse; background: white; border: 1px solid #ddd;">
                <thead>
                    <tr>
                        <th style="width: 80px;">N°</th>
                        <th>Especialidad / Servicio Clínico</th>
                        <th>Disponibilidad</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="e, stat : ${especialidades}">
                        <td th:text="${stat.count}">1</td>
                        <td th:text="${e.nombre}"></td>
                        <td style="color: green; font-weight: bold;">Disponible para Citas</td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(especialidades)}">
                        <td colspan="3" style="text-align: center; color: #777; padding: 20px;">No hay especialidades registradas.</td>
                    </tr>
                </tbody>
            </table>
        </main>
    </div>

    <script th:src="@{/js/app.js}"></script>
</body>
</html>
